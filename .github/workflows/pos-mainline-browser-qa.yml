name: POS mainline browser QA (local synthetic only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/pos/**'
      - 'src/routes/_protected/pos/**'
      - 'scripts/pos-*-browser-qa.mjs'
      - 'scripts/pos-mainline-disabled-browser-qa.mjs'
      - '.github/workflows/pos-mainline-browser-qa.yml'
  push:
    branches: [codex/pos-mainline-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: POS browser ${{ matrix.suite }} (four viewports)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: disabled
            script: scripts/pos-mainline-disabled-browser-qa.mjs
          - suite: catalog
            script: scripts/pos-stage-c-browser-qa.mjs
          - suite: sale-refund
            script: scripts/pos-stage-f-browser-qa.mjs
          - suite: ux
            script: scripts/pos-ux-a-browser-qa.mjs
          - suite: channel-ux
            script: scripts/pos-channel-ux-browser-qa.mjs
          - suite: production-trial
            script: scripts/pos-production-trial-browser-qa.mjs
    env:
      VITE_POS_PREVIEW: "true"
      VITE_BACKEND_URL: ""
      POS_QA_URL: http://127.0.0.1:4173
      POS_QA_EVIDENCE: /tmp/basicdiet-pos-mainline-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run isolated browser verification (no external hosts)
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/pos-mainline-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-mainline-${{ matrix.suite }}-screenshots
          path: /tmp/basicdiet-pos-mainline-${{ matrix.suite }}
          if-no-files-found: warn
