name: POS Stage C Catalog Browser QA

on:
  pull_request:
    branches:
      - codex/pos-staging-preview
    paths:
      - "src/features/pos/**"
      - "scripts/pos-stage-c-browser-qa.mjs"
      - ".github/workflows/pos-stage-c-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-stage-c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-four-viewports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise synthetic cashier menu save and publish
        env:
          VITE_POS_PREVIEW: "true"
          VITE_BACKEND_URL: ""
          POS_QA_URL: http://127.0.0.1:4173
          POS_QA_EVIDENCE: /tmp/basicdiet-pos-stage-c
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/pos-stage-c-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node scripts/pos-stage-c-browser-qa.mjs
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-stage-c-review
          path: /tmp/basicdiet-pos-stage-c
          if-no-files-found: warn
