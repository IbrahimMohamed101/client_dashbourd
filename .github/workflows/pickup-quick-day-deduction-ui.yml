name: Pickup quick day deduction UI

on:
  pull_request:
    paths:
      - "src/components/pages/operations-board/OperationsPickupBoard.tsx"
      - "src/components/pages/operations-board/PickupQuickDayDeductionCard.tsx"
      - ".github/workflows/pickup-quick-day-deduction-ui.yml"

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
