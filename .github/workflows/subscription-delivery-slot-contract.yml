name: Subscription delivery slot contract

on:
  push:
    branches:
      - agent/require-subscription-delivery-slot
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/validations/createSubscriptionSchema.ts"
      - "tests/subscriptionCreationContract.test.ts"
      - ".github/workflows/subscription-delivery-slot-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Verify subscription creation contract
        run: npx vitest run tests/subscriptionCreationContract.test.ts
