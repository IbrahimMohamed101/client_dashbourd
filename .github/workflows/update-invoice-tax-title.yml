name: Apply tax invoice title update

on:
  push:
    paths:
      - .github/workflows/update-invoice-tax-title.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update printed tax invoice title
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/pages/subscriptions/invoice/SubscriptionInvoiceDialog.tsx')
          text = path.read_text()
          lines = text.splitlines()

          matches = [i for i, line in enumerate(lines) if 'فاتورة ضريبية مبسطة' in line]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one simplified tax title, found {len(matches)}')

          i = matches[0]
          lines[i] = lines[i].replace('فاتورة ضريبية مبسطة', 'فاتورة ضريبية')

          close_idx = None
          for j in range(i + 1, min(i + 5, len(lines))):
              if lines[j].strip() == '</p>':
                  close_idx = j
                  break
          if close_idx is None:
              raise SystemExit('Could not locate tax title closing </p>')

          if any('Tax Invoice' in line for line in lines[max(0, i - 2):min(len(lines), i + 8)]):
              raise SystemExit('Tax Invoice subtitle already exists near title; refusing duplicate')

          indent = lines[close_idx][:len(lines[close_idx]) - len(lines[close_idx].lstrip())]
          subtitle = [
              indent + '{isTaxInvoice ? (',
              indent + '  <p className="text-[9px] font-semibold" dir="ltr">',
              indent + '    Tax Invoice',
              indent + '  </p>',
              indent + ') : null}',
          ]
          lines[close_idx + 1:close_idx + 1] = subtitle
          updated = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          if 'فاتورة ضريبية مبسطة' in updated:
              raise SystemExit('Old simplified title still present')
          if updated.count('Tax Invoice') != 1:
              raise SystemExit('Expected exactly one Tax Invoice subtitle')

          path.write_text(updated)
          PY

          git diff --check
          git diff -- src/components/pages/subscriptions/invoice/SubscriptionInvoiceDialog.tsx

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/subscriptions/invoice/SubscriptionInvoiceDialog.tsx
          git commit -m "ux: simplify printed tax invoice title"
          git push origin HEAD:main
