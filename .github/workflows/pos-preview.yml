name: POS independent preview build
on:
  pull_request:
    paths:
      - 'pos.html'
      - 'vite.pos.config.ts'
      - 'src/pos/**'
      - 'package.json'
      - '.github/workflows/pos-preview.yml'
permissions:
  contents: read
jobs:
  pos-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript verification
        run: npx tsc -b
      - name: Build POS only
        run: npm run build:pos
      - name: Check isolated output
        run: |
          test -f dist-pos/pos.html
          test -d dist-pos/assets
          test ! -e dist-pos/index.html
