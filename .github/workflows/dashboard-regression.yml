name: Dashboard full regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BACKEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm run build
