name: Fix invoice duplicate summary lines

on:
  push:
    paths:
      - .github/workflows/fix-invoice-duplicate-summary-lines.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard duplicate delivery and discount rows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/pages/subscriptions/invoice/SubscriptionInvoiceDialog.tsx')
          text = path.read_text()

          anchor = '  const lineItems = financial?.lineItems || [];\n'
          addition = (
              anchor
              + '  const hasDeliveryLineItem = lineItems.some((item) => item.kind === "delivery");\n'
              + '  const hasDiscountLineItem = lineItems.some((item) => item.kind === "discount");\n'
          )
          if 'const hasDeliveryLineItem' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'Expected one lineItems anchor, found {text.count(anchor)}')
              text = text.replace(anchor, addition, 1)

          old_discount = '              {financial && financial.discountHalala > 0 ? (\n'
          new_discount = '              {financial && financial.discountHalala > 0 && !hasDiscountLineItem ? (\n'
          if old_discount in text:
              text = text.replace(old_discount, new_discount, 1)
          elif new_discount not in text:
              raise SystemExit('Discount render condition not found')

          old_delivery = '              {financial && financial.deliveryFeeHalala > 0 ? (\n'
          new_delivery = '              {financial && financial.deliveryFeeHalala > 0 && !hasDeliveryLineItem ? (\n'
          if old_delivery in text:
              text = text.replace(old_delivery, new_delivery, 1)
          elif new_delivery not in text:
              raise SystemExit('Delivery render condition not found')

          if text.count('const hasDeliveryLineItem') != 1:
              raise SystemExit('Expected exactly one delivery line-item guard')
          if text.count('const hasDiscountLineItem') != 1:
              raise SystemExit('Expected exactly one discount line-item guard')
          if old_delivery in text or old_discount in text:
              raise SystemExit('Old duplicate-prone conditions still present')

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/components/pages/subscriptions/invoice/SubscriptionInvoiceDialog.tsx

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pages/subscriptions/invoice/SubscriptionInvoiceDialog.tsx
          git commit -m "fix: avoid duplicate invoice delivery and discount rows"
          git push origin HEAD:main
