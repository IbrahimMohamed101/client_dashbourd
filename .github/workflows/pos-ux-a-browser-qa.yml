name: POS UX A Viewport Browser QA

on:
  push:
    branches:
      - codex/pos-ux-a-fullscreen-20261105
  pull_request:
    branches:
      - codex/pos-staging-preview
    paths:
      - "src/features/pos/**"
      - "src/routes/_protected/route.tsx"
      - "scripts/pos-ux-a-browser-qa.mjs"
      - ".github/workflows/pos-ux-a-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-viewports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install local Chromium for isolated POS viewport checks
        run: npx playwright install --with-deps chromium
      - name: Start synthetic local POS UI and check four viewports
        env:
          VITE_POS_PREVIEW: "true"
          VITE_BACKEND_URL: ""
          POS_QA_URL: http://127.0.0.1:4173
          POS_QA_EVIDENCE: /tmp/basicdiet-pos-ux-a
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/pos-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node scripts/pos-ux-a-browser-qa.mjs
      - name: Upload four viewport screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-ux-a-viewports
          path: /tmp/basicdiet-pos-ux-a
          if-no-files-found: warn
