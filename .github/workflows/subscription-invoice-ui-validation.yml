name: Subscription invoice UI validation

on:
  push:
    branches:
      - main
    paths:
      - "src/components/pages/subscriptions/invoice/**"
      - "src/components/pages/subscriptions/details/subscription-header.tsx"
      - "src/components/pages/subscriptions/subscriptions-table.tsx"
      - "src/components/pages/subscriptions/subscriptions-columns.tsx"
      - "src/components/pages/subscriptions/create/CreateSubscriptionFormContent.tsx"
      - "src/routes/_protected/subscriptions/$subscriptionId/index.tsx"
      - ".github/workflows/subscription-invoice-ui-validation.yml"
  pull_request:
    paths:
      - "src/components/pages/subscriptions/invoice/**"
      - "src/components/pages/subscriptions/details/subscription-header.tsx"
      - "src/components/pages/subscriptions/subscriptions-table.tsx"
      - "src/components/pages/subscriptions/subscriptions-columns.tsx"
      - "src/components/pages/subscriptions/create/CreateSubscriptionFormContent.tsx"
      - "src/routes/_protected/subscriptions/$subscriptionId/index.tsx"
      - ".github/workflows/subscription-invoice-ui-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck and build dashboard
        run: npm run build
      - name: Smoke production backend invoice route
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          url="https://basicdiet145-production-51e9.up.railway.app/api/dashboard/subscriptions/000000000000000000000000/invoice"
          status="$(curl --silent --show-error --location --output /tmp/invoice-smoke.json --write-out '%{http_code}' --max-time 20 "$url")"
          echo "invoice route unauthenticated status=$status"
          if [[ "$status" != "401" && "$status" != "403" ]]; then
            cat /tmp/invoice-smoke.json || true
            echo "Expected the deployed invoice route to reject an unauthenticated request with 401/403."
            exit 1
          fi
      - name: Verify production dashboard exposes prominent invoice actions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base="https://clientdashbourd-production.up.railway.app"
          work=/tmp/dashboard-crawl
          mkdir -p "$work"
          curl --silent --show-error --location --max-time 20 "$base/" -o "$work/index.html"
          python - <<'PY'
          import re, urllib.parse, urllib.request, time

          base = 'https://clientdashbourd-production.up.railway.app/'
          asset_re = re.compile(r'(?:/|\./)?assets/[A-Za-z0-9_.-]+\.(?:js|css)')

          def crawl():
              queue = []
              seen = set()
              blobs = []
              with urllib.request.urlopen(base, timeout=20) as response:
                  html = response.read().decode('utf-8', errors='ignore')
              for value in re.findall(r'(?:src|href)=["\']([^"\']+\.(?:js|css))(?:\?[^"\']*)?["\']', html):
                  queue.append(urllib.parse.urljoin(base, value))
              while queue and len(seen) < 400:
                  url = queue.pop(0)
                  if url in seen:
                      continue
                  seen.add(url)
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          data = response.read().decode('utf-8', errors='ignore')
                  except Exception as exc:
                      print('fetch failed', url, exc)
                      continue
                  blobs.append(data)
                  for ref in asset_re.findall(data):
                      queue.append(urllib.parse.urljoin(base, ref))
              return len(seen), '\n'.join(blobs)

          for attempt in range(1, 8):
              count, combined = crawl()
              invoice_present = ('عرض وطباعة الفاتورة' in combined) and ('SubscriptionInvoiceDialog' in combined)
              tax_present = ('فاتورة ضريبية مبسطة' in combined) or ('SIMPLIFIED TAX INVOICE' in combined)
              qr_present = ('QR الفاتورة الضريبية' in combined) or ('Tax invoice QR code' in combined)
              list_action_present = ('فواتير الاشتراكات' in combined) and ('بدون الدخول للتفاصيل' in combined)
              create_action_present = ('الفاتورة جاهزة للطباعة' in combined)
              details_action_present = ('فاتورة الاشتراك' in combined) and ('فاتورة ضريبية + QR' in combined)
              print(
                  f'attempt={attempt} crawled_assets={count} '
                  f'invoice={int(invoice_present)} tax={int(tax_present)} qr={int(qr_present)} '
                  f'list={int(list_action_present)} create={int(create_action_present)} details={int(details_action_present)}'
              )
              if all((invoice_present, tax_present, qr_present, list_action_present, create_action_present, details_action_present)):
                  raise SystemExit(0)
              if attempt < 7:
                  time.sleep(10)
          raise SystemExit(1)
          PY
