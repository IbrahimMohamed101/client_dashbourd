name: Subscription invoice UI validation

on:
  push:
    branches:
      - main
    paths:
      - "src/components/pages/subscriptions/invoice/**"
      - "src/components/pages/subscriptions/details/subscription-header.tsx"
      - "src/routes/_protected/subscriptions/$subscriptionId/index.tsx"
      - ".github/workflows/subscription-invoice-ui-validation.yml"
  pull_request:
    paths:
      - "src/components/pages/subscriptions/invoice/**"
      - "src/components/pages/subscriptions/details/subscription-header.tsx"
      - "src/routes/_protected/subscriptions/$subscriptionId/index.tsx"
      - ".github/workflows/subscription-invoice-ui-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck and build dashboard
        run: npm run build
      - name: Smoke production backend invoice route
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          url="https://basicdiet145-production-51e9.up.railway.app/api/dashboard/subscriptions/000000000000000000000000/invoice"
          status="$(curl --silent --show-error --location --output /tmp/invoice-smoke.json --write-out '%{http_code}' --max-time 20 "$url")"
          echo "invoice route unauthenticated status=$status"
          if [[ "$status" != "401" && "$status" != "403" ]]; then
            cat /tmp/invoice-smoke.json || true
            echo "Expected the deployed invoice route to reject an unauthenticated request with 401/403."
            exit 1
          fi
      - name: Verify production dashboard bundle contains invoice UI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base="https://clientdashbourd-production.up.railway.app"
          curl --silent --show-error --location --max-time 20 "$base/" -o /tmp/dashboard-index.html
          python - <<'PY'
          import re, pathlib, urllib.parse
          html = pathlib.Path('/tmp/dashboard-index.html').read_text(errors='ignore')
          assets = re.findall(r'(?:src|href)=["\']([^"\']+\.(?:js|css))(?:\?[^"\']*)?["\']', html)
          print('\n'.join(assets))
          pathlib.Path('/tmp/assets.txt').write_text('\n'.join(assets))
          PY
          found=0
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            if [[ "$asset" == http* ]]; then url="$asset"; else url="$base/${asset#/}"; fi
            curl --silent --show-error --location --max-time 20 "$url" >> /tmp/dashboard-bundle.txt
            printf '\n' >> /tmp/dashboard-bundle.txt
          done < /tmp/assets.txt
          if grep -Fq "طباعة الفاتورة" /tmp/dashboard-bundle.txt || grep -Fq "SubscriptionInvoiceDialog" /tmp/dashboard-bundle.txt; then
            found=1
          fi
          echo "invoice_ui_present=$found"
          test "$found" = "1"
