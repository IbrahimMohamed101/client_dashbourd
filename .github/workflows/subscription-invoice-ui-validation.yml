name: Subscription invoice UI validation

on:
  push:
    branches:
      - main
    paths:
      - "src/components/pages/subscriptions/invoice/**"
      - "src/components/pages/subscriptions/details/subscription-header.tsx"
      - "src/routes/_protected/subscriptions/$subscriptionId/index.tsx"
      - ".github/workflows/subscription-invoice-ui-validation.yml"
  pull_request:
    paths:
      - "src/components/pages/subscriptions/invoice/**"
      - "src/components/pages/subscriptions/details/subscription-header.tsx"
      - "src/routes/_protected/subscriptions/$subscriptionId/index.tsx"
      - ".github/workflows/subscription-invoice-ui-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck and build dashboard
        run: npm run build
      - name: Smoke production backend invoice route
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          url="https://basicdiet145-production-51e9.up.railway.app/api/dashboard/subscriptions/000000000000000000000000/invoice"
          status="$(curl --silent --show-error --location --output /tmp/invoice-smoke.json --write-out '%{http_code}' --max-time 20 "$url")"
          echo "invoice route unauthenticated status=$status"
          if [[ "$status" != "401" && "$status" != "403" ]]; then
            cat /tmp/invoice-smoke.json || true
            echo "Expected the deployed invoice route to reject an unauthenticated request with 401/403."
            exit 1
          fi
      - name: Verify production dashboard lazy chunks contain invoice UI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base="https://clientdashbourd-production.up.railway.app"
          work=/tmp/dashboard-crawl
          mkdir -p "$work"
          curl --silent --show-error --location --max-time 20 "$base/" -o "$work/index.html"
          python - <<'PY'
          import pathlib, re, urllib.parse, urllib.request

          base = 'https://clientdashbourd-production.up.railway.app/'
          root = pathlib.Path('/tmp/dashboard-crawl')
          queue = []
          seen = set()
          blobs = []

          html = (root / 'index.html').read_text(errors='ignore')
          for value in re.findall(r'(?:src|href)=["\']([^"\']+\.(?:js|css))(?:\?[^"\']*)?["\']', html):
              queue.append(urllib.parse.urljoin(base, value))

          asset_re = re.compile(r'(?:/|\./)?assets/[A-Za-z0-9_.-]+\.(?:js|css)')
          while queue and len(seen) < 400:
              url = queue.pop(0)
              if url in seen:
                  continue
              seen.add(url)
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = r.read().decode('utf-8', errors='ignore')
              except Exception as exc:
                  print('fetch failed', url, exc)
                  continue
              blobs.append(data)
              for ref in asset_re.findall(data):
                  queue.append(urllib.parse.urljoin(base, ref))

          combined = '\n'.join(blobs)
          present = ('طباعة الفاتورة' in combined) or ('SubscriptionInvoiceDialog' in combined) or ('معاينة فاتورة الاشتراك' in combined)
          print(f'crawled_assets={len(seen)}')
          print(f'invoice_ui_present={1 if present else 0}')
          if not present:
              raise SystemExit(1)
          PY
