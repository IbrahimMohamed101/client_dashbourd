name: Finalize accounting dashboard

on:
  push:
    branches:
      - fix/accounting-reports-final
    paths:
      - .github/workflows/finalize-accounting-dashboard.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accounting-reports-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Open accounting on today's report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_protected/accounting/index.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'const [reportMode, setReportMode] = useState<AccountingReportMode>("range");'
          new = 'const [reportMode, setReportMode] = useState<AccountingReportMode>("daily");'
          if text.count(old) != 1:
              raise SystemExit(f'expected one default report mode, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused accounting tests
        run: npx vitest run tests/accountingReports.test.ts tests/accountingRangeUx.test.ts
      - name: Build production dashboard
        run: npm run build
      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-accounting-dashboard.yml
          git add src/routes/_protected/accounting/index.tsx
          git commit -m "fix(accounting): default to today's report"
          git push origin HEAD:fix/accounting-reports-final
