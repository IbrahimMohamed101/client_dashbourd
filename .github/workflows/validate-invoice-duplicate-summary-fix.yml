name: Validate invoice duplicate summary fix

on:
  push:
    paths:
      - .github/workflows/validate-invoice-duplicate-summary-fix.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build dashboard
        run: npm run build
      - name: Verify invoice duplicate guards
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/components/pages/subscriptions/invoice/SubscriptionInvoiceDialog.tsx';
          const s = fs.readFileSync(p, 'utf8');
          const required = [
            'const hasDeliveryLineItem = lineItems.some((item) => item.kind === "delivery")',
            'const hasDiscountLineItem = lineItems.some((item) => item.kind === "discount")',
            'financial.deliveryFeeHalala > 0 && !hasDeliveryLineItem',
            'financial.discountHalala > 0 && !hasDiscountLineItem',
          ];
          for (const text of required) {
            if (!s.includes(text)) throw new Error(`Missing expected guard: ${text}`);
          }
          if (s.includes('financial && financial.deliveryFeeHalala > 0 ?')) {
            throw new Error('Old duplicate-prone delivery condition is still present');
          }
          console.log('Invoice duplicate summary guards verified');
          NODE
