name: Meal Builder Safety

on:
  pull_request:
    branches: [main]
    paths:
      - "src/utils/mealPlannerOptionDraftActions.ts"
      - "src/utils/mealPlannerOptionDraftActions.test.ts"
      - "src/components/pages/menu/meal-builder/**"
      - "src/types/mealPlannerDashboardTypes.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/meal-builder-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meal-builder-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Meal Builder mutation client
        run: npx vitest run src/utils/mealPlannerOptionDraftActions.test.ts

      - name: TypeScript and production build
        run: npm run build
